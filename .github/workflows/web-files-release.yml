name: Web files release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit in Code-With-Reza/GGWP-26.2 containing WebXR support"
        required: true
        default: main
        type: string
      tag_name:
        description: "Release tag to create or update in this repository"
        required: true
        default: web-files-v26.2.0
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    defaults:
      run:
        working-directory: build-source
        shell: bash
    env:
      EAGLER_BUILD_CAP_MIB: "13312"
      EAGLER_LINK_HEAP_MIB: "12288"
      JAVA_HOME: 'C:\Program Files\Eclipse Adoptium\jdk-25.0.1.8-hotspot'

    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Check out game source
        uses: actions/checkout@v4
        with:
          repository: Code-With-Reza/GGWP-26.2
          ref: ${{ inputs.source_ref }}
          path: build-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: build-source/package-lock.json

      - name: Use installed Eclipse Adoptium Java 25
        shell: pwsh
        run: |
          $java = Join-Path $env:JAVA_HOME "bin\java.exe"
          if (!(Test-Path $java)) {
            throw "Java 25 was not found at $java. Update JAVA_HOME in this workflow to your installed JDK 25 directory."
          }
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& $java -version 2>&1 | Out-String)
          Write-Host $version
          if ($version -notmatch 'version "25(?:\.|")') {
            throw "The configured JAVA_HOME must point to JDK 25."
          }

      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - name: Verify WebXR source and build web output
        run: |
          if ! grep -q "WebXRController" platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/PlatformRuntime.java ||
             ! grep -q "immersive-ar" platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/webgl2/WebXRController.java; then
            echo "The selected source_ref does not contain the WebXR implementation. Push the WebXR source to Code-With-Reza/GGWP-26.2 and select that ref." >&2
            exit 1
          fi
          mkdir -p wasm-toolchain/generated
          node wasm-toolchain/build-single-html.js \
            --output wasm-toolchain/generated/not-published.html \
            --music-pack-output wasm-toolchain/generated/not-published-music.zip

      - name: Add and compress the optional music archive
        run: |
          web_dir="target_teavm_wasm_gc/build/web"
          cp game/music.epk "$web_dir/music.epk"
          node wasm-toolchain/precompress-web.js "$web_dir"

      - name: Package and validate web files
        id: package
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          $tagName = $env:INPUT_TAG_NAME
          if ($tagName -notmatch '^[A-Za-z0-9._/-]+$') {
            throw "Invalid release tag: $tagName"
          }
          $safeTag = $tagName.Replace("/", "-")
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "releases"
          $archive = Join-Path $releaseDirectory "eaglercraft-26.2-web-files-$safeTag.zip"
          $webDirectory = Join-Path $env:GITHUB_WORKSPACE "build-source\target_teavm_wasm_gc\build\web"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Compress-Archive -Path (Join-Path $webDirectory "*") -DestinationPath $archive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @{}
            foreach ($entry in $zip.Entries) {
              $entries[$entry.FullName.Replace("\", "/")] = $true
            }
            $required = @(
              "index.html", "classes.wasm", "mesh-worker.wasm", "server-worker.wasm",
              "classes.wasm-runtime.js", "assets.epk", "sounds.epk", "music.epk",
              "music.epk.br", "music.epk.gz"
            )
            foreach ($file in $required) {
              if (!$entries.ContainsKey($file)) {
                throw "Web archive is missing $file"
              }
            }
          } finally {
            $zip.Dispose()
          }
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Eaglercraft 26.2 web files ${{ steps.package.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: ${{ steps.package.outputs.archive }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-web-files
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
