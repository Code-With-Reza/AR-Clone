name: Web files release

"on":
  push:
    tags:
      - "web-files-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true
        default: "web-files-v26.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    # TeaVM's precise linker needs more memory than a standard hosted runner.
    # Set WEB_BUILD_RUNNER to a different large/self-hosted runner label if needed.
    runs-on: ${{ vars.WEB_BUILD_RUNNER || 'ubuntu-24.04-16core' }}
    timeout-minutes: 240
    defaults:
      run:
        working-directory: GGWP-26.2
    env:
      EAGLER_BUILD_CAP_MIB: "13312"
      EAGLER_LINK_HEAP_MIB: "12288"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: GGWP-26.2/package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-fund --no-audit

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build precise Wasm-GC web output
        run: |
          mkdir -p "$RUNNER_TEMP/web-files-build"
          node wasm-toolchain/build-single-html.js \
            --output "$RUNNER_TEMP/web-files-build/not-published.html" \
            --music-pack-output "$RUNNER_TEMP/web-files-build/not-published-music.zip"

      - name: Add and compress the optional music archive
        run: |
          web_dir="target_teavm_wasm_gc/build/web"
          cp game/music.epk "$web_dir/music.epk"
          node wasm-toolchain/precompress-web.js "$web_dir"

      - name: Package web files
        id: package
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_name="$INPUT_TAG_NAME"
          else
            tag_name="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag_name" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid release tag: $tag_name" >&2
            exit 1
          fi
          safe_tag="${tag_name//\//-}"
          archive="$GITHUB_WORKSPACE/releases/eaglercraft-26.2-web-files-${safe_tag}.zip"
          mkdir -p "$GITHUB_WORKSPACE/releases"
          (
            cd target_teavm_wasm_gc/build/web
            zip -qr "$archive" .
          )
          for required in index.html classes.wasm mesh-worker.wasm server-worker.wasm \
              classes.wasm-runtime.js assets.epk sounds.epk music.epk music.epk.br music.epk.gz; do
            unzip -Z1 "$archive" | grep -Fxq "$required" || {
              echo "Web archive is missing $required" >&2
              exit 1
            }
          done
          echo "tag=$tag_name" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish web files to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Eaglercraft 26.2 web files ${{ steps.package.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: ${{ steps.package.outputs.archive }}

      - name: Upload ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-web-files
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error