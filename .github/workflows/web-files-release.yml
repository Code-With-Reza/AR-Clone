name: Web files release

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repository containing the WebXR-enabled game source"
        required: true
        default: Code-With-Reza/AR-Clone
        type: string
      source_ref:
        description: "Branch, tag, or commit in source_repository containing WebXR support"
        required: true
        default: webar
        type: string
      tag_name:
        description: "Release tag to create or update in this repository"
        required: true
        default: web-files-v26.2.0
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    defaults:
      run:
        working-directory: build-source
        shell: pwsh
    env:
      EAGLER_BUILD_CAP_MIB: "9728"
      EAGLER_LINK_HEAP_MIB: "8192"
      JAVA_HOME: 'C:\Program Files\Eclipse Adoptium\jdk-25.0.1.8-hotspot'
      EAGLER_BASH: 'C:\Program Files\Git\bin\bash.exe'

    steps:
      - name: Check out game source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: build-source

      - name: Identify game source commit
        id: source
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          Write-Host "Game source commit: $sourceCommit"
          "commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore verified TeaVM linker outputs
        uses: actions/cache@v4
        with:
          path: |
            build-source/wasm-toolchain/generated
            build-source/target_teavm_wasm_gc/build/generated/teavm/wasm-gc-standalone
            build-source/target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc-standalone
            build-source/target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc-standalone
          key: web-link-v1-${{ runner.os }}-jdk25-${{ inputs.source_repository }}-${{ steps.source.outputs.commit }}
          restore-keys: |
            web-link-v1-${{ runner.os }}-jdk25-${{ inputs.source_repository }}-

      - name: Use installed Node.js
        run: |
          $nodeVersion = (& node.exe --version).Trim()
          $npmVersion = (& npm.cmd --version).Trim()
          Write-Host "Using Node.js $nodeVersion and npm $npmVersion"
          if ($nodeVersion -notmatch '^v(20|22|24)\.') {
            throw "Install Node.js 20, 22, or 24 and make sure node.exe is on the runner service PATH."
          }
          if (!(Test-Path $env:EAGLER_BASH)) {
            throw "Git Bash was not found at $env:EAGLER_BASH. Update EAGLER_BASH to the Git for Windows bash.exe path."
          }
          $bashVersion = (& $env:EAGLER_BASH --version | Select-Object -First 1)
          Write-Host "Using $bashVersion"
          if ($bashVersion -notmatch '^GNU bash, version') {
            throw "EAGLER_BASH must point to GNU Bash from Git for Windows."
          }

      - name: Use installed Eclipse Adoptium Java 25
        shell: pwsh
        run: |
          $java = Join-Path $env:JAVA_HOME "bin\java.exe"
          if (!(Test-Path $java)) {
            throw "Java 25 was not found at $java. Update JAVA_HOME in this workflow to your installed JDK 25 directory."
          }
          "$env:JAVA_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& $java -version 2>&1 | Out-String)
          Write-Host $version
          if ($version -notmatch 'version "25(?:\.|")') {
            throw "The configured JAVA_HOME must point to JDK 25."
          }

      - name: Install Node dependencies
        run: npm.cmd ci --no-fund --no-audit

      - name: Verify WebXR source and build web output
        env:
          INPUT_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim()
          Write-Host "Building '$env:INPUT_SOURCE_REPOSITORY' ref '$env:INPUT_SOURCE_REF' at commit '$sourceCommit'"
          $platformRuntime = "platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/PlatformRuntime.java"
          $webXrController = "platform-teavm/src/main/java/net/lax1dude/eaglercraft/v1_8/internal/webgl2/WebXRController.java"
          $missingWebXrSource = @()
          if (!(Test-Path $platformRuntime) -or !(Select-String -Path $platformRuntime -Pattern "WebXRController" -Quiet)) {
            $missingWebXrSource += $platformRuntime
          }
          if (!(Test-Path $webXrController) -or !(Select-String -Path $webXrController -Pattern "immersive-ar" -Quiet)) {
            $missingWebXrSource += $webXrController
          }
          if ($missingWebXrSource.Count -gt 0) {
            $missingFiles = $missingWebXrSource -join ", "
            throw "Ref '$env:INPUT_SOURCE_REF' ($sourceCommit) in '$env:INPUT_SOURCE_REPOSITORY' is missing WebXR source: $missingFiles. Push the WebXR changes to that repository, then rerun using the pushed branch, tag, or commit."
          }
          New-Item -ItemType Directory -Path "wasm-toolchain/generated" -Force | Out-Null
          node.exe wasm-toolchain/build-single-html.js `
            --output "wasm-toolchain/generated/not-published.html" `
            --music-pack-output "wasm-toolchain/generated/not-published-music.zip"

      - name: Add and compress the optional music archive
        run: |
          $webDirectory = "target_teavm_wasm_gc/build/web"
          Copy-Item "game/music.epk" (Join-Path $webDirectory "music.epk") -Force
          node.exe wasm-toolchain/precompress-web.js $webDirectory

      - name: Package and validate web files
        id: package
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          $tagName = $env:INPUT_TAG_NAME
          if ($tagName -notmatch '^[A-Za-z0-9._/-]+$') {
            throw "Invalid release tag: $tagName"
          }
          $safeTag = $tagName.Replace("/", "-")
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "releases"
          $archive = Join-Path $releaseDirectory "eaglercraft-26.2-web-files-$safeTag.zip"
          $webDirectory = Join-Path $env:GITHUB_WORKSPACE "build-source\target_teavm_wasm_gc\build\web"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          
          # Load .NET compression and build zip fast without file conflicts
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          if (Test-Path $archive) { Remove-Item $archive -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($webDirectory, $archive, [System.IO.Compression.CompressionLevel]::Fastest, $false)
          
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = @{}
            foreach ($entry in $zip.Entries) {
              $entries[$entry.FullName.Replace("\", "/")] = $true
            }
            $required = @(
              "index.html", "classes.wasm", "mesh-worker.wasm", "server-worker.wasm",
              "classes.wasm-runtime.js", "assets.epk", "sounds.epk", "music.epk",
              "music.epk.br", "music.epk.gz"
            )
            foreach ($file in $required) {
              if (!$entries.ContainsKey($file)) {
                throw "Web archive is missing $file"
              }
            }
          } finally {
            $zip.Dispose()
          }
          "tag=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Eaglercraft 26.2 web files ${{ steps.package.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          files: ${{ steps.package.outputs.archive }}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-web-files
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
